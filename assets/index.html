  <script>
    function fetchJSON(url, options = {}) {
      const {
        method = "GET",
        parseJSON = true,
        logErrors = true,
        body = null,
        headers = {},
      } = options;

      try {
        const xhr = new XMLHttpRequest();
        xhr.open(method.toUpperCase(), url, false); // synchronous request

        // Set headers
        Object.entries(headers).forEach(([key, value]) => {
          xhr.setRequestHeader(key, value);
        });

        // Send with optional body
        const requestBody = body
          ? (typeof body === "string" ? body : JSON.stringify(body))
          : null;
        xhr.send(requestBody);

        if (xhr.status === 200) {
          const response = xhr.responseText;
          return parseJSON ? JSON.parse(response) : response;
        }

        if (logErrors) {
          console.error(`Failed to fetch ${url}:`, xhr.statusText);
        }

        return null;
      } catch (error) {
        if (logErrors) {
          console.error(`Error fetching ${url}:`, error);
        }
        return null;
      }
    }
    globalThis._VSCODE_PRODUCT_JSON = fetchJSON("./product.json");
    globalThis._VSCODE_PACKAGE_JSON = fetchJSON("./package.json");
    globalThis._VSCODE_FILE_ROOT = new URL(
      "./out/",
      window.location.href,
    ).toString();
  </script>

  <script src="/codigoBridge.js"></script>
  <script src="/polkadotBridge.js"></script>

  <script src="/out/nls.messages.js"></script>
  <script type="module">
    import {
      create,
      URI,
    } from "/out/vs/workbench/workbench.web.main.internal.js";
    const response = await fetch("/workbench.json", { method: "POST" });
    const config = await response.json();
    class MessagePortsController {
      constructor() {
        this._webIdeChannel = new MessageChannel();
        this.polkadotBridgeChannel = new MessageChannel();

        const messagePorts = new Map();
        messagePorts.set(
          "btwiuse.codigo-bridge",
          this._webIdeChannel.port2,
        );
        messagePorts.set(
          "btwiuse.polkadot-bridge",
          this.polkadotBridgeChannel.port2,
        );

        this._messagePorts = messagePorts;
      }

      get messagePorts() {
        return this._messagePorts;
      }

      get polkadotBridgePort() {
        return this.polkadotBridgeChannel.port1;
      }

      onTokenChange() {
        this._webIdeChannel.port1.postMessage("webide_auth_change");
      }
    }
    const messagePortsController = new MessagePortsController();
    messagePortsController.polkadotBridgePort.onmessage = async (
      event,
    ) => {
      const { data } = event;
      const port = messagePortsController.polkadotBridgePort;

      if (data.cmd === "CONNECT") {
        try {
          const app = await windowInjectedWeb3().enable(
            "Polkadot bridge extension",
          );
          createBridgeHandler(port, app);
          port.postMessage({ cmd: "CONNECT_SUCCESS" });
        } catch (error) {
          port.postMessage({
            cmd: "CONNECT_ERROR",
            error: error.message,
          });
        }
      }
    };
    create(document.body, {
      ...config,
      messagePorts: messagePortsController.messagePorts,
      webviewEndpoint: "/out/vs/workbench/contrib/webview/browser/pre",
      workspaceProvider: {
        workspace: {
          folderUri: URI.from({
            scheme: "hostfs",
            path: "/",
          }),
        },
      },
    });
  </script>
