<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <!-- Mobile tweaks -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Code">
    <link rel="apple-touch-icon" href="/code-192.png" />

    <!-- Disable pinch zooming -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no"
    >

    <!-- Workbench Icon/Manifest/CSS -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/out/vs/workbench/workbench.web.main.css">
    <script type="importmap">
      {
        "imports": {
          "eruda": "https://esm.sh/eruda"
        }
      }
    </script>
  </head>

  <body aria-label=""></body>

  <!-- Startup (do not modify order of script tags!) -->
  <script type="module" async>
    import eruda from "eruda";
    eruda.init();
  </script>
  <script>
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/workbench.json", false);
    xhr.send(null);

    if (xhr.status === 200) {
      var meta = document.createElement("meta");
      meta.id = "vscode-workbench-web-configuration";
      meta.setAttribute("data-settings", xhr.responseText);
      document.head.appendChild(meta);
    } else {
      console.error("Fetching workbench config failed:", xhr.statusText);
    }

    globalThis._VSCODE_FILE_ROOT = new URL("/out/", window.location.href)
      .toString();
  </script>
  <script src="/bridge.js"></script>

  <script src="/out/nls.messages.js"></script>
  <script type="module">
    import {
      create,
      URI,
    } from "/out/vs/workbench/workbench.web.main.internal.js";
    const response = await fetch("/workbench.json", { method: "POST" });
    const config = await response.json();
    create(document.body, {
      ...config,
      webviewEndpoint: "/out/vs/workbench/contrib/webview/browser/pre",
      workspaceProvider: {
        workspace: {
          folderUri: URI.from({
            scheme: "hostfs",
            path: "/",
          }),
        },
      },
    });
  </script>
</html>
